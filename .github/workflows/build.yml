name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Host tests
        run: make -C test host

      - name: Simulator end-to-end tests (real server code, API + browser)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          make -C test sim

      - name: Build firmware
        run: pio run

      - name: Check the built app image
        run: g++ -std=c++17 -I test/host -o /tmp/t_fw test/host/test_fwimage.cpp && /tmp/t_fw

      - name: Collect binaries
        run: |
          B=.pio/build/cardputer-adv
          mkdir -p dist
          # firmware.bin: the app alone — what M5Launcher installs from the SD card.
          cp $B/firmware.bin dist/PocketWUI.bin
          # Full image (bootloader + partitions + app) for flashing at 0x0.
          cp $B/firmware.factory.bin dist/PocketWUI-full-flash.bin
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
