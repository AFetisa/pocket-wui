<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PocketWUI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='5' fill='%2316a34a'/%3E%3Crect x='8' y='10' width='16' height='8' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f4;--panel:#fff;--panel2:#f0f2ef;--line:#e2e6e1;--fg:#18201c;--dim:#667069;
  --accent:#15803d;--accent-fg:#fff;--accent-soft:#dcfce7;--danger:#dc2626;--warn:#b45309;--blue:#2563eb;
  --shadow:0 1px 2px #0000000d,0 8px 28px #00000012;--r:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0d1210;--panel:#141a17;--panel2:#1a221e;--line:#25302a;--fg:#e0e8e3;--dim:#8b988f;
  --accent:#22c55e;--accent-fg:#052e14;--accent-soft:#12321f;--danger:#f87171;--warn:#fbbf24;--blue:#60a5fa;
  --shadow:0 1px 2px #0006,0 10px 30px #0008;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1210;--panel:#141a17;--panel2:#1a221e;--line:#25302a;--fg:#e0e8e3;--dim:#8b988f;
  --accent:#22c55e;--accent-fg:#052e14;--accent-soft:#12321f;--danger:#f87171;--warn:#fbbf24;--blue:#60a5fa;
  --shadow:0 1px 2px #0006,0 10px 30px #0008;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
 padding:7px 12px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.ibtn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--dim)}
.ibtn:hover{background:var(--panel2);color:var(--fg)}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);
 border-radius:9px;padding:9px 11px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.muted{color:var(--dim)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.hidden{display:none!important}

/* sign-in */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:60;background:var(--bg)}
.card{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.logo svg{width:18px;height:18px}
#login p{margin:10px 0 18px;color:var(--dim)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
.msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--danger)}

/* shell */
#app{height:100%;display:none;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:var(--panel2);font-size:12.5px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.meter{width:46px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:140px;overflow-x:auto;white-space:nowrap;font-weight:600}
.crumbs a{color:var(--fg);text-decoration:none;padding:4px 7px;border-radius:7px;cursor:pointer}
.crumbs a:hover{background:var(--panel2)}
.crumbs span{color:var(--dim)}
.search{position:relative;width:min(300px,100%)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{padding-left:34px}
#selbar{display:flex;align-items:center;gap:8px;margin:0 14px 8px;padding:8px 10px;border-radius:var(--r);background:var(--accent-soft);flex-wrap:wrap}
#banner{margin:0 14px 10px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#list{flex:1;overflow:auto;margin:0 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;font-weight:600;font-size:12.5px;color:var(--dim);
 padding:9px 10px;border-bottom:1px solid var(--line);user-select:none}
th.sort{cursor:pointer}
th.sort:hover{color:var(--fg)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
tr.sel{background:var(--accent-soft)!important}
td.ck,th.ck{width:34px;padding-right:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.nm{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .sub{display:none;font-size:12px;color:var(--dim)}
.ftype{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--t-bg,var(--panel2));color:var(--t-fg,var(--dim))}
.ftype.dir{--t-bg:#dbeafe;--t-fg:#1d4ed8}.ftype.img{--t-bg:#fce7f3;--t-fg:#be185d}.ftype.vid{--t-bg:#ede9fe;--t-fg:#6d28d9}
.ftype.aud{--t-bg:#ffedd5;--t-fg:#c2410c}.ftype.txt{--t-bg:#e0f2fe;--t-fg:#0369a1}.ftype.zip{--t-bg:#fef9c3;--t-fg:#a16207}.ftype.bin{--t-bg:#dcfce7;--t-fg:#15803d}
:root[data-theme=dark] .ftype.dir{--t-bg:#172a4a;--t-fg:#93c5fd}:root[data-theme=dark] .ftype.img{--t-bg:#3f1630;--t-fg:#f9a8d4}
:root[data-theme=dark] .ftype.vid{--t-bg:#2a1d52;--t-fg:#c4b5fd}:root[data-theme=dark] .ftype.aud{--t-bg:#3d220f;--t-fg:#fdba74}
:root[data-theme=dark] .ftype.txt{--t-bg:#0c2c40;--t-fg:#7dd3fc}:root[data-theme=dark] .ftype.zip{--t-bg:#3a300c;--t-fg:#fde047}
:root[data-theme=dark] .ftype.bin{--t-bg:#10341f;--t-fg:#86efac}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ftype.dir{--t-bg:#172a4a;--t-fg:#93c5fd}:root:not([data-theme=light]) .ftype.img{--t-bg:#3f1630;--t-fg:#f9a8d4}
:root:not([data-theme=light]) .ftype.vid{--t-bg:#2a1d52;--t-fg:#c4b5fd}:root:not([data-theme=light]) .ftype.aud{--t-bg:#3d220f;--t-fg:#fdba74}
:root:not([data-theme=light]) .ftype.txt{--t-bg:#0c2c40;--t-fg:#7dd3fc}:root:not([data-theme=light]) .ftype.zip{--t-bg:#3a300c;--t-fg:#fde047}
:root:not([data-theme=light]) .ftype.bin{--t-bg:#10341f;--t-fg:#86efac}}
td.num{color:var(--dim);white-space:nowrap;font-size:13px}
td.act{width:44px;text-align:right}
.empty{padding:48px 16px;text-align:center;color:var(--dim)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}
tr[draggable]{cursor:default}
tr.dragging{opacity:.4}
.into{outline:2px dashed var(--accent);outline-offset:-2px}

/* menus, modals, toasts */
.menu{position:fixed;z-index:70;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#modal{position:fixed;inset:0;z-index:50;background:#0008;display:none;place-items:center;padding:14px}
#modal.on{display:grid}
.sheet{width:min(880px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.sheet.narrow{width:min(520px,100%)}
.sheet>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.sheet>header .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{padding:16px;overflow:auto}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.viewer{display:grid;place-items:center;min-height:200px;background:var(--panel2);border-radius:10px;overflow:hidden;position:relative}
.viewer img,.viewer video{max-width:100%;max-height:68vh;display:block}
.viewer iframe{width:100%;height:68vh;border:0;background:#fff}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:#000a;color:#fff;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer}
.viewer .nav.l{left:10px}.viewer .nav.r{right:10px}
#edit{width:100%;height:58vh;resize:vertical;font:13px/1.55 var(--mono);white-space:pre;overflow-wrap:normal}
.md{line-height:1.6;max-width:760px}
.md pre{background:var(--panel2);padding:10px;border-radius:8px;overflow:auto}
.md code{font-family:var(--mono);font-size:.92em;background:var(--panel2);padding:1px 4px;border-radius:4px}
.md pre code{background:none;padding:0}
.md blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--dim)}.kv dd{margin:0;word-break:break-all}
.sec{margin-bottom:22px}
.sec h3{margin:0 0 8px;font-size:15px}
.sec p{margin:4px 0 10px}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list>div{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 11px;border-bottom:2px solid transparent;cursor:pointer;color:var(--dim);white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
code.addr{font-family:var(--mono);background:var(--panel2);padding:4px 8px;border-radius:7px;user-select:all}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:min(560px,92vw);pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
#jobs{position:fixed;right:14px;bottom:14px;width:min(340px,92vw);display:flex;flex-direction:column;gap:8px;z-index:40}
.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px}
.job .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .track{height:4px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.job .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.job.fail .fill{background:var(--danger)}
#drop{position:fixed;inset:10px;border:3px dashed var(--accent);border-radius:18px;background:#15803d22;z-index:45;display:none;place-items:center;
 font-size:18px;font-weight:600;color:var(--accent);pointer-events:none}
#drop.on{display:grid}

/* console */
#console{height:220px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:#0b0f0d;color:#c8e6d5;font:12.5px/1.5 var(--mono)}
#out{flex:1;overflow:auto;padding:8px 12px;white-space:pre-wrap;word-break:break-word}
#out .cmd{color:#4ade80}#out .err{color:#f87171}#out .dim{color:#6f8c7d}
#cl{display:flex;gap:8px;padding:6px 12px;border-top:1px solid #1e2a24}
#cl span{color:#4ade80}
#cmd{flex:1;background:none;border:0;outline:none;padding:0;color:inherit;font:inherit}

@media (max-width:700px){
  .chip.opt,th.num,td.num{display:none}
  .nm .sub{display:block}
  .bar{padding:10px}
  #list{margin:0 8px 8px}
  .search{width:100%;order:5}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <div class="brand"><span class="logo" data-i="card"></span>PocketWUI</div>
    <p>Your Cardputer's SD card, right here in the browser. Enter the password shown on the Cardputer's screen — or press its side button and scan the QR code to skip this.</p>
    <label class="field"><span>Password</span><input type="password" id="pw" autocomplete="current-password" autofocus></label>
    <button class="btn primary" style="width:100%;justify-content:center" id="loginBtn">Unlock</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <div class="brand"><span class="logo" data-i="card"></span><span class="hide-sm">PocketWUI</span></div>
    <div class="chips">
      <span class="chip" id="cNet" title="Connection"></span>
      <span class="chip opt" id="cSd" title="SD card"></span>
      <span class="chip opt" id="cBat" title="Battery"></span>
    </div>
    <button class="ibtn" id="bTerm" title="Console (Ctrl+`)" data-i="term"></button>
    <button class="ibtn" id="bSet" title="Settings" data-i="gear"></button>
    <button class="ibtn" id="bOut" title="Lock" data-i="lock"></button>
  </header>

  <main>
    <div class="bar">
      <div class="crumbs" id="crumbs"></div>
      <label class="search"><span data-i="search"></span><input type="search" id="q" placeholder="Search files…" title="Type to filter this folder · Enter searches the whole card" autocomplete="off"></label>
      <button class="btn primary" id="bUpload"><span data-i="upload"></span>Upload</button>
      <button class="btn" id="bNew" title="New…"><span data-i="plus"></span><span class="hide-sm">New</span></button>
      <button class="ibtn" id="bMore" title="More" data-i="more"></button>
      <input type="file" id="file" multiple hidden>
      <input type="file" id="dir" webkitdirectory directory multiple hidden>
    </div>
    <div id="banner" class="hidden"></div>
    <div id="selbar" class="hidden"></div>
    <div id="list"></div>
  </main>

  <div id="console" class="hidden">
    <div id="out"></div>
    <div id="cl"><span>$</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="type help"></div>
  </div>
</div>

<div id="jobs"></div>
<div id="toasts" aria-live="polite"></div>
<div id="drop">Drop to upload here</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>

  move:"M5 12h14M13 6l6 6-6 6", info:"M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM12 11v5M12 8h.01", x:"M6 6l12 12M18 6L6 18",

  usb:"M12 3v14M12 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM12 13l-4-3V7M12 11l4-2V6M7 7h2M15 6h2", sd:"M7 3h7l4 4v14H7zM10 7v3M13 7v3",
  bat:"M3 8h15v8H3zM21 11v2", eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",

function icon(n){ const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24");
  s.setAttribute("class","i"); const p=document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",P[n]||P.file); s.append(p); return s; }
document.querySelectorAll("[data-i]").forEach(n=>n.prepend(icon(n.dataset.i)));

/* ---------- state ---------- */
let CWD="/", ENTRIES=[], STATUS={}, SEL=new Set(), FILTER="", RESULTS=null;
const store={ get(k,d){ try{ const v=localStorage.getItem("pw."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
              set(k,v){ try{ localStorage.setItem("pw."+k,JSON.stringify(v)); }catch(e){} } };
let SORT=store.get("sort",{k:"name",d:1}), HIDDEN=store.get("hidden",false);
function applyTheme(){ const t=store.get("theme","auto"); if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme=t; }
applyTheme();

/* ---------- transport ---------- */
async function api(path, opts={}){
  const r=await fetch(path, Object.assign({credentials:"same-origin"}, opts));
  if(r.status===401){ showLogin(); throw new Error("please sign in again"); }
  return r;
}
async function parse(r){ const t=await r.text(); let j;
  try{ j=JSON.parse(t); }catch(e){ throw new Error(t.slice(0,160)||("error "+r.status)); }
  if(!r.ok||j.error) throw new Error(j.error||("error "+r.status)); return j; }
const jget=p=>api(p).then(parse);
const jpost=(p,body)=>api(p,{method:"POST",body:body==null?"":(typeof body==="string"?body:JSON.stringify(body))}).then(parse);

/* ---------- helpers ---------- */
const enc=encodeURIComponent;
function join(dir,name){ return (dir.endsWith("/")?dir:dir+"/")+name; }
function parent(p){ if(p==="/")return "/"; const i=p.lastIndexOf("/"); return i<=0?"/":p.slice(0,i); }
function base(p){ return p.split("/").pop()||"/"; }
function human(b){ if(b==null)return "–"; const u=["B","KB","MB","GB","TB"]; let i=0,v=b;
  while(v>=1024&&i<u.length-1){v/=1024;i++;} return (i?v.toFixed(v<10?1:0):v)+" "+u[i]; }
function when(ts){ if(!ts)return ""; const d=new Date(ts*1000), now=new Date();
  const o=d.getFullYear()===now.getFullYear()?{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}:{year:"numeric",month:"short",day:"numeric"};
  return d.toLocaleString([],o); }
const EXT=(n=>{const i=n.lastIndexOf(".");return i>0?n.slice(i+1).toLowerCase():"";});
const KINDS={img:"jpg jpeg png gif webp bmp svg ico avif",vid:"mp4 m4v webm mov ogv",aud:"mp3 wav ogg oga opus flac m4a aac",
  txt:"txt md markdown log csv tsv json xml html htm css js ini cfg conf yaml yml toml c h cpp hpp py sh bat gcode nfo env",zip:"zip 7z rar gz tgz tar",bin:"bin",pdf:"pdf"};
function kind(n,dir){ if(dir)return "dir"; const e=EXT(n); for(const k in KINDS) if((" "+KINDS[k]+" ").includes(" "+e+" ")) return k; return n.includes(".")?"file":"txt"; }
const KIND_ICON={dir:"folder",img:"img",vid:"vid",aud:"aud",txt:"txt",zip:"zip",bin:"bin",pdf:"file",file:"file"};
function dlUrl(p,inline){ return "/api/download?path="+enc(p)+(inline?"&inline=1":""); }
function download(url,name){ const a=el("a",{href:url,download:name||""}); document.body.append(a); a.click(); a.remove(); }

function toast(msg,err){ const t=el("div","toast"+(err?" err":""),msg); $("#toasts").append(t); setTimeout(()=>t.remove(),err?6000:3200); if(err) log(msg,"err"); }
async function guard(fn){ try{ return await fn(); }catch(e){ toast(e.message,true); } }

/* ---------- menus & modals ---------- */
let openMenu=null;
function menu(anchor,items){
  closeMenu(); const m=el("div","menu");
  for(const it of items){ if(!it){ m.append(el("hr")); continue; }
    m.append(el("button",{class:it.danger?"danger":"",onclick:()=>{ closeMenu(); it.fn(); }},icon(it.i),it.t)); }
  document.body.append(m); const r=anchor.getBoundingClientRect(), w=m.offsetWidth, h=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+"px";
  m.style.top=(r.bottom+h+8>innerHeight?Math.max(8,r.top-h-4):r.bottom+4)+"px"; openMenu=m;
}
function closeMenu(){ if(openMenu){ openMenu.remove(); openMenu=null; } }
addEventListener("mousedown",e=>{ if(openMenu&&!openMenu.contains(e.target)) closeMenu(); });

let onModalClose=null;
function modal(title,body,foot,cls){
  const sh=$("#sheet"); sh.className="sheet"+(cls?" "+cls:""); sh.innerHTML="";
  sh.append(el("header",null,el("div","t",title),el("button",{class:"ibtn",title:"Close",onclick:closeModal},icon("x"))));
  const b=el("div","body"); if(body) b.append(body); sh.append(b);
  if(foot&&foot.length) sh.append(el("div","foot",foot));
  $("#modal").classList.add("on"); return b;
}
function closeModal(){ $("#modal").classList.remove("on"); $("#sheet").innerHTML=""; if(onModalClose){ const f=onModalClose; onModalClose=null; f(); } }
$("#modal").addEventListener("mousedown",e=>{ if(e.target.id==="modal") closeModal(); });
function ask(title,label,value,okText){ return new Promise(res=>{
  const inp=el("input",{type:"text",value:value||""}); let done=false;
  const ok=()=>{ done=true; const v=inp.value.trim(); closeModal(); res(v||null); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") ok(); });
  onModalClose=()=>{ if(!done) res(null); };
  modal(title,el("label","field",el("span",null,label),inp),[el("button",{class:"btn",onclick:closeModal},"Cancel"),el("button",{class:"btn primary",onclick:ok},okText||"OK")],"narrow");
  setTimeout(()=>{ inp.focus(); const d=inp.value.lastIndexOf("."); inp.setSelectionRange(0,d>0?d:inp.value.length); },30);
}); }
function confirmBox(title,text,okText,danger){ return new Promise(res=>{ let done=false;
  onModalClose=()=>{ if(!done) res(false); };
  modal(title,el("p",null,text),[el("button",{class:"btn",onclick:closeModal},"Cancel"),
    el("button",{class:"btn "+(danger?"danger":"primary"),onclick:()=>{ done=true; closeModal(); res(true); }},okText||"OK")],"narrow");
}); }

/* ---------- sign-in ---------- */
function showLogin(){ $("#app").style.display="none"; $("#login").style.display="grid"; setTimeout(()=>$("#pw").focus(),40); }
function showApp(){ $("#login").style.display="none"; $("#app").style.display="flex"; }
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#loginBtn"); b.disabled=true; $("#loginMsg").textContent="";
  try{ const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",body:JSON.stringify({password:$("#pw").value})});
    await parse(r); $("#pw").value=""; showApp(); boot(); }
  catch(err){ $("#loginMsg").textContent=err.message; } finally{ b.disabled=false; }
});
$("#bOut").onclick=async()=>{ try{ await jpost("/api/logout"); }catch(e){} showLogin(); };

/* ---------- status ---------- */
async function refreshStatus(){
  try{ STATUS=await jget("/api/status"); }catch(e){ return; }
  const S=STATUS, n=$("#cNet"); n.innerHTML="";
  if(S.usb&&S.usb.host&&location.hostname===S.usb.ip) n.append(icon("usb"),el("b",null,"USB cable"));
  else n.append(icon("wifi"),el("b",null,S.ap?"Hotspot "+S.ap_ssid:S.ssid));
  const sd=$("#cSd"); sd.innerHTML="";
  if(S.sd_lent) sd.append(icon("usb"),"lent to computer");
  else if(S.sd_total){ const m=el("span","meter",el("i")); m.firstChild.style.width=Math.round(S.sd_used/S.sd_total*100)+"%";
    sd.append(icon("sd"),m,el("b",null,human(S.sd_total-S.sd_used)),"free"); }
  else sd.append(icon("sd"),"no card");
  const bt=$("#cBat"); bt.innerHTML=""; bt.classList.toggle("hidden",!(S.bat>=0));
  if(S.bat>=0) bt.append(icon("bat"),el("b",null,S.bat+"%"),S.charging?"charging":"");
  banner();
}
function banner(){
  const b=$("#banner"); b.innerHTML="";
  if(STATUS.sd_lent){ b.append(el("div","row",icon("usb"),el("div","grow",el("b",null,"Your SD card is on your computer right now. "),
    "It shows up there as a USB drive. Eject it on the computer to use it here again."),
    el("button",{class:"btn",onclick:()=>usbDrive(false)},"Take it back")));
  } else if(STATUS.sd===false){ b.append(el("div","row",icon("sd"),el("div","grow",el("b",null,"No SD card found. "),"Insert a card, then refresh.")));
  } else if(CWD===WUI_TRASH&&!RESULTS){
    b.append(el("div","row",icon("trash"),el("div","grow","Deleted items wait here, so you can change your mind. Move them anywhere to restore them."),
      el("button",{class:"btn danger",onclick:async()=>{ if(await confirmBox("Empty the Trash?","Everything in the Trash is deleted for good.","Empty Trash",true))
        await guard(async()=>{ await jpost("/api/trash/empty"); toast("Trash emptied"); go("/"); }); }},"Empty Trash")));
  }
  b.classList.toggle("hidden",!b.childNodes.length);
}

/* ---------- listing ---------- */
let renderSeq=0;
async function go(path){ CWD=path||"/"; SEL.clear(); RESULTS=null; FILTER=""; $("#q").value=""; await render(); }
function crumbs(){
  const cb=$("#crumbs"); cb.innerHTML="";
  const home=el("a",{title:"SD card"},icon("sd")," SD card"); home.onclick=()=>go("/"); dropTarget(home,"/"); cb.append(home);
  let acc="/"; for(const part of CWD.split("/").filter(Boolean)){
    acc=join(acc,part); const p=acc; cb.append(el("span",null,"/"));
    const a=el("a",null,p===WUI_TRASH?"Trash":part); a.onclick=()=>go(p); dropTarget(a,p); cb.append(a);
  }
  if(RESULTS) cb.append(el("span",null," · "),el("a",null,"results for “"+RESULTS.q+"”"));
}
const WUI_TRASH="/.trash";
async function render(){
  crumbs();
  const mine=++renderSeq; let d,err;
  if(STATUS.sd_lent){ banner(); list([],"The SD card is lent to your computer"); return; }
  if(!RESULTS){ try{ d=await jget("/api/list?path="+enc(CWD)); }catch(e){ err=e; } }
  if(mine!==renderSeq) return;
  banner();
  if(err){ list([],CWD===WUI_TRASH?"The trash is empty":"Can't open this folder — "+err.message); return; }
  if(!RESULTS) ENTRIES=d.entries.map(e=>Object.assign(e,{path:join(CWD,e.name)}));
  draw(); refreshStatus();
}
function visible(){
  let v=RESULTS?RESULTS.items:ENTRIES;
  if(!HIDDEN&&!RESULTS) v=v.filter(e=>!e.name.startsWith("."));
  if(FILTER) v=v.filter(e=>e.name.toLowerCase().includes(FILTER.toLowerCase()));
  const k=SORT.k, d=SORT.d;
  return v.slice().sort((a,b)=>(b.dir-a.dir)||d*(k==="size"?a.size-b.size:k==="mtime"?a.mtime-b.mtime:a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"})));
}
function draw(){
  const rows=visible();
  if(!rows.length){
    const msg=RESULTS?"Nothing matches “"+RESULTS.q+"”":FILTER?"Nothing here matches “"+FILTER+"” — press Enter to search the whole card":
      CWD===WUI_TRASH?"The trash is empty":"This folder is empty — drop files here to upload";
    list([],msg); return;
  }
  list(rows);
}
function list(rows,emptyMsg){
  const box=$("#list"); box.innerHTML="";
  if(!rows.length){ box.append(el("div","empty",icon(RESULTS||FILTER?"search":"folder"),el("div",null,emptyMsg))); selbar(); return; }
  const all=el("input",{type:"checkbox",title:"Select all"});
  all.checked=rows.every(r=>SEL.has(r.path)); all.onchange=()=>{ rows.forEach(r=>all.checked?SEL.add(r.path):SEL.delete(r.path)); draw(); };
  const th=(label,k,cls)=>{ const h=el("th",{class:(cls||"")+" sort"},label+(SORT.k===k?(SORT.d>0?" ↑":" ↓"):""));
    h.onclick=()=>{ SORT={k,d:SORT.k===k?-SORT.d:1}; store.set("sort",SORT); draw(); }; return h; };
  const t=el("table",null,el("thead",null,el("tr",null,el("th","ck",all),th("Name","name"),th("Size","size","num"),th("Modified","mtime","num"),el("th"))));
  const tb=el("tbody"); t.append(tb);
  for(const e of rows){
    const k=kind(e.name,e.dir), tr=el("tr",{class:SEL.has(e.path)?"sel":""});
    const ck=el("input",{type:"checkbox"}); ck.checked=SEL.has(e.path);
    ck.onchange=()=>{ ck.checked?SEL.add(e.path):SEL.delete(e.path); tr.classList.toggle("sel",ck.checked); selbar(); all.checked=rows.every(r=>SEL.has(r.path)); };
    const sub=(e.dir?"":human(e.size)+" · ")+when(e.mtime)+(RESULTS?" · "+parent(e.path):"");
    const nm=el("div","nm",el("span","ftype "+k,icon(KIND_ICON[k])),el("div","grow",el("div","t",e.name),el("div","sub",sub)));
    nm.onclick=()=>open(e);
    if(RESULTS) nm.title=e.path;
    const more=el("button",{class:"ibtn",title:"Actions"},icon("more")); more.onclick=()=>rowMenu(more,e);
    tr.append(el("td","ck",ck),el("td",null,nm),el("td","num",e.dir?"":human(e.size)),el("td","num",when(e.mtime)),el("td","act",more));
    tr.addEventListener("contextmenu",ev=>{ ev.preventDefault(); rowMenu(more,e); });
    dragSource(tr,e.path); if(e.dir) dropTarget(tr,e.path);
    tb.append(tr);
  }
  box.append(t); selbar();
}
function rowMenu(anchor,e){
  const items=[];
  if(e.dir) items.push({i:"folder",t:"Open",fn:()=>go(e.path)},{i:"dl",t:"Download as ZIP",fn:()=>zipOne(e.path)},{i:"info",t:"Folder size",fn:()=>folderSize(e.path)});
  else items.push({i:"eye",t:"Open",fn:()=>open(e)},{i:"dl",t:"Download",fn:()=>{ download(dlUrl(e.path),e.name); log("get "+e.path,"dim"); }});
  if(RESULTS) items.push({i:"folder",t:"Show in folder",fn:()=>go(parent(e.path))});
  items.push(null,{i:"edit",t:"Rename",fn:()=>renameOne(e)},{i:"copy",t:"Copy to…",fn:()=>transfer([e.path],true)},
    {i:"move",t:"Move to…",fn:()=>transfer([e.path],false)});
  if(!e.dir) items.push({i:"hash",t:"Checksum (SHA-256)",fn:()=>hashFile(e.path)});
  items.push(null,{i:"trash",t:inTrash(e.path)?"Delete forever":"Move to Trash",danger:true,fn:()=>remove([e.path])});
  menu(anchor,items);
}
const inTrash=p=>p===WUI_TRASH||p.startsWith(WUI_TRASH+"/");
function selbar(){
  const b=$("#selbar"); b.innerHTML=""; const n=SEL.size; b.classList.toggle("hidden",!n); if(!n) return;
  const paths=[...SEL];
  b.append(el("b",null,n+" selected"),el("span","grow"),
    el("button",{class:"btn",onclick:()=>downloadMany(paths)},icon("dl"),"Download"),
    el("button",{class:"btn",onclick:()=>transfer(paths,true)},icon("copy"),el("span","hide-sm","Copy")),
    el("button",{class:"btn",onclick:()=>transfer(paths,false)},icon("move"),el("span","hide-sm","Move")),
    el("button",{class:"btn danger",onclick:()=>remove(paths)},icon("trash"),el("span","hide-sm","Delete")),
    el("button",{class:"ibtn",title:"Clear selection",onclick:()=>{ SEL.clear(); draw(); }},icon("x")));
}

/* ---------- search ---------- */
$("#q").addEventListener("input",e=>{ FILTER=e.target.value; if(RESULTS&&!FILTER){ RESULTS=null; render(); return; } draw(); });
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.value.trim()) deepSearch(e.target.value.trim());
  if(e.key==="Escape"){ e.target.value=""; FILTER=""; if(RESULTS){ RESULTS=null; render(); } else draw(); } });
async function deepSearch(q){
  $("#list").innerHTML=""; $("#list").append(el("div","empty",icon("search"),el("div",null,"Searching the card for “"+q+"”…")));
  try{ const r=await jget("/api/find?path="+enc(CWD)+"&q="+enc(q));
    RESULTS={q,items:r.results.map(x=>Object.assign(x,{name:base(x.path)}))}; FILTER=""; SEL.clear();
    crumbs(); draw(); if(r.truncated) toast("Showing the first "+r.results.length+" matches — refine the search to see more");
  }catch(e){ toast(e.message,true); render(); }
}

/* ---------- actions ---------- */
async function renameOne(e){
  const n=await ask("Rename",e.dir?"Folder name":"File name",e.name,"Rename"); if(!n||n===e.name) return;
  if(n.includes("/")) return toast("Names can't contain /",true);
  await guard(async()=>{ await jpost("/api/rename?from="+enc(e.path)+"&to="+enc(join(parent(e.path),n))); render(); });
}
async function remove(paths){
  const forever=paths.every(inTrash), what=paths.length===1?"“"+base(paths[0])+"”":paths.length+" items";
  if(forever&&!await confirmBox("Delete forever?","Permanently delete "+what+"? This can't be undone.","Delete forever",true)) return;
  let ok=0; for(const p of paths){ try{ await jpost("/api/delete?path="+enc(p)+(forever?"":"&trash=1")); ok++; SEL.delete(p); }catch(e){ toast(e.message,true); } }
  if(ok) toast(forever?"Deleted "+ok+" item"+(ok>1?"s":""):"Moved "+ok+" item"+(ok>1?"s":"")+" to the Trash");
  if(RESULTS) RESULTS.items=RESULTS.items.filter(x=>!paths.includes(x.path)||SEL.has(x.path));
  render();
}
async function doMove(from,dir){
  const to=join(dir,base(from)); if(to===from||parent(from)===dir) return;
  if((dir+"/").startsWith(from+"/")) return toast("Can't move a folder inside itself",true);
  try{ await jpost("/api/rename?from="+enc(from)+"&to="+enc(to)); log("mv "+from+" "+to,"dim"); }
  catch(e){
    if(!e.message.startsWith("already exists")) return toast(e.message,true);
    if(!await confirmBox("Replace “"+base(from)+"”?","“"+(dir==="/"?"SD card":base(dir))+"” already has an item with this name. Replace it? The old one goes to the Trash.","Replace",true)) return;
    await guard(async()=>{ await jpost("/api/delete?path="+enc(to)+"&trash=1"); await jpost("/api/rename?from="+enc(from)+"&to="+enc(to)); });
  }
}
async function transfer(paths,copy){
  const dir=await pickFolder(copy?"Copy to…":"Move to…",copy?"Copy here":"Move here"); if(dir==null) return;
  if(copy){
    const body=paths.map(p=>{ let to=join(dir,base(p)); if(to===p) to=join(dir,"Copy of "+base(p)); return p+"\t"+to; }).join("\n");
    await guard(async()=>{ await jpost("/api/copy",body); watchJob("Copying"); });
  } else { for(const p of paths) await doMove(p,dir); SEL.clear(); render(); }
}
function zipOne(path){ download("/api/zip?path="+enc(path),base(path)+".zip"); log("zip "+path,"dim"); }
async function downloadMany(paths){
  if(paths.length===1){ const e=[...ENTRIES,...(RESULTS?RESULTS.items:[])].find(x=>x.path===paths[0]);
    if(e&&!e.dir){ download(dlUrl(e.path),e.name); return; } return zipOne(paths[0]); }
  await guard(async()=>{ const t=await jpost("/api/zipticket",paths.join("\n"));
    const name=(CWD==="/"?"files":base(CWD))+".zip"; download("/api/zip?t="+t.t+"&name="+enc(name),name); });
}
async function folderSize(path){ await guard(async()=>{ const r=await jget("/api/du?path="+enc(path)); toast("“"+base(path)+"” holds "+human(r.bytes)); }); }
async function hashFile(path){ await guard(async()=>{ await jpost("/api/hash?path="+enc(path)); watchJob("Checksum"); }); }

/* folder picker */
function pickFolder(title,okText){ return new Promise(res=>{
  let at=CWD, done=false;
  const finish=v=>{ done=true; closeModal(); res(v); };
  const show=async()=>{
    const body=el("div"), c=el("div","crumbs"), l=el("div","list");
    const root=el("a",{title:"SD card"},icon("sd")); root.onclick=()=>{ at="/"; show(); }; c.append(root);
    let acc="/"; for(const p of at.split("/").filter(Boolean)){ acc=join(acc,p); const q=acc; c.append(el("span",null,"/"));
      const a=el("a",null,p); a.onclick=()=>{ at=q; show(); }; c.append(a); }
    body.append(c,el("div",{style:"height:8px"}),l);
    onModalClose=()=>{ if(!done) res(null); };
    modal(title,body,[el("button",{class:"btn",onclick:async()=>{
        onModalClose=null; const n=await ask("New folder","Folder name","","Create");
        if(n&&await guard(()=>jpost("/api/mkdir?path="+enc(join(at,n))))) at=join(at,n);
        show(); }},icon("plus"),"New folder"),
      el("span","grow"),el("button",{class:"btn",onclick:closeModal},"Cancel"),
      el("button",{class:"btn primary",onclick:()=>finish(at)},okText)],"narrow");
    try{ const d=await jget("/api/list?path="+enc(at));
      const dirs=d.entries.filter(e=>e.dir&&(HIDDEN||!e.name.startsWith("."))).sort((a,b)=>a.name.localeCompare(b.name));
      if(!dirs.length) l.append(el("div","muted","No folders inside"));
      for(const e of dirs){ const r=el("div",{style:"cursor:pointer"},el("span","ftype dir",icon("folder")),e.name);
        r.onclick=()=>{ at=join(at,e.name); show(); }; l.append(r); }
    }catch(e){ l.append(el("div","muted",e.message)); }
  };
  show();
}); }

/* ---------- background jobs ---------- */
let jobTimer=null;
function watchJob(label){
  const c=card(label,()=>jpost("/api/job/cancel").catch(()=>{})); clearInterval(jobTimer);
  jobTimer=setInterval(async()=>{ let j; try{ j=await jget("/api/job"); }catch(e){ return; }
    c.name(label+" "+(j.label||"")); if(j.total) c.set(j.done/j.total,human(j.done)+" / "+human(j.total));
    if(j.state==="running") return;
    clearInterval(jobTimer);
    if(j.state==="error"){ c.fail(j.error); toast(j.error,true); return; }
    c.done();
    if(j.kind==="hash") showHash(j.label,j.result);
    else if(j.kind==="firmware") restarting();
    else { toast("Done: "+(j.result||label)); render(); }
  },600);
}
function showHash(name,hex){ modal("SHA-256 of "+name,el("div",null,el("p","muted small","Compare this with the checksum the file's publisher gives you."),
  el("code","addr",hex)),[el("button",{class:"btn",onclick:()=>{ navigator.clipboard&&navigator.clipboard.writeText(hex); toast("Copied"); }},icon("copy"),"Copy"),el("button",{class:"btn primary",onclick:closeModal},"Done")],"narrow"); }

/* ---------- previews ---------- */
const MAXEDIT=256*1024;
async function open(e){
  if(e.dir) return go(e.path);
  const k=kind(e.name,false);
  if(k==="img") return gallery(e);
  if(k==="vid"||k==="aud"){ const m=el(k==="vid"?"video":"audio",{controls:true,autoplay:true,src:dlUrl(e.path,true),preload:"metadata"});
    return modal(e.name,el("div","viewer",m),previewFoot(e)); }
  if(k==="pdf"||/^html?$/.test(EXT(e.name))) return modal(e.name,el("div","viewer",el("iframe",{src:dlUrl(e.path,true),sandbox:/^html?$/.test(EXT(e.name))?"":false})),previewFoot(e));
  if(k==="txt") return openText(e);
  if(k==="bin") return firmwareFile(e);
  return infoSheet(e);
}
function previewFoot(e){ return [el("button",{class:"btn",onclick:()=>infoSheet(e)},icon("info"),"Info"),
  el("a",{class:"btn",href:dlUrl(e.path,true),target:"_blank",rel:"noopener"},icon("eye"),"Open in new tab"),

function markdown(src){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^):\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null, code=null, para=[];
  const flush=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } if(list){ out.push("</"+list+">"); list=null; } };
  for(const line of src.split("\n")){
    if(code!==null){ if(/^```/.test(line)){ out.push("<pre><code>"+esc(code)+"</code></pre>"); code=null; } else code+=line+"\n"; continue; }
    let m;
    if(/^```/.test(line)){ flush(); code=""; }
    else if((m=line.match(/^(#{1,6})\s+(.*)/))){ flush(); out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); }
    else if((m=line.match(/^\s*([-*+]|\d+\.)\s+(.*)/))){ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; }
      const t=/\d/.test(m[1])?"ol":"ul"; if(list!==t){ if(list) out.push("</"+list+">"); out.push("<"+t+">"); list=t; } out.push("<li>"+inline(m[2])+"</li>"); }
    else if(/^>\s?/.test(line)){ flush(); out.push("<blockquote>"+inline(line.replace(/^>\s?/,""))+"</blockquote>"); }
    else if(/^(-{3,}|\*{3,})\s*$/.test(line)){ flush(); out.push("<hr>"); }
    else if(!line.trim()) flush();
    else para.push(line.trim());
  }
  if(code!==null) out.push("<pre><code>"+esc(code)+"</code></pre>");
  flush(); return out.join("");
}

const CHUNK=256*1024, RETRIES=4;
function card(name,onCancel){
  const fn=el("div","fn",name), pc=el("span","muted small","0%"), x=el("button",{class:"ibtn",title:"Cancel"},icon("x"));
  const fill=el("div","fill"), c=el("div","job",el("div","row",fn,pc,x),el("div","track",fill)); $("#jobs").append(c);

           done:()=>{ pc.textContent="done"; fill.style.width="100%"; setTimeout(()=>c.remove(),1500); }, cancelled:()=>cancelled };

async function putBlob(path, blob, job){
  const total=blob.size; let off=0, stuck=0, lastResync=-1;
  while(off<total || (total===0&&off===0)){
    if(job&&job.cancelled()) throw new Error("cancelled");
    const end=Math.min(off+CHUNK,total);
    const part=blob.slice(off,end);
    let ok=false, lastErr, resync=null;
    for(let a=0;a<RETRIES&&!ok;a++){
      try{
        const r=await api("/api/upload?path="+enc(path)+"&offset="+off+(end>=total?"&final=1":""),
                          {method:"POST",body:part,headers:{"Content-Type":"application/octet-stream"}});
        const j=await r.json().catch(()=>({error:"bad response"}));
        if(r.status===409 && typeof j.size==="number"){ resync=j.size; break; }  // device knows better
        if(!r.ok||j.error) throw new Error(j.error||("http "+r.status));
        ok=true;
      }catch(e){ lastErr=e; await new Promise(s=>setTimeout(s,250*(a+1))); }
    }
    if(resync!==null){
      // A chunk that died mid-write leaves the card holding part of it; the 409
      // tells us where the file really ends. That is normal recovery on a flaky
      // link, so only a resync that keeps landing on the SAME offset is a fault.
      if(resync>total) throw new Error("device holds "+human(resync)+" for this path, more than the "+human(total)+" being sent");
      if(resync===lastResync){ if(++stuck>5) throw new Error("upload stuck at "+human(resync)+" — device is not accepting this chunk"); }
      else { stuck=0; lastResync=resync; }
      off=resync; if(job) job.set(total?off/total:0,"resyncing…"); continue;
    }
    if(!ok) throw new Error("upload failed at "+human(off)+": "+(lastErr&&lastErr.message));
    off=end; if(job) job.set(total?off/total:1, human(off)+(total?" / "+human(total):""));
    if(total===0) break;
  }
  return true;
}

async function ensureDir(path, baseDir, made){
  if(path===baseDir || path==="/" || made.has(path)) return;
  await ensureDir(parent(path), baseDir, made);
  await jpost("/api/mkdir?path="+enc(path)); made.add(path);

async function uploadItems(items, baseDir){
  baseDir=baseDir||CWD; const made=new Set();
  if(baseDir===CWD){ const clash=items.filter(it=>!it.dir&&!it.rel.includes("/")&&ENTRIES.some(e=>e.name===it.rel&&!e.dir));
    if(clash.length&&!await confirmBox("Replace files?",clash.length+" file"+(clash.length>1?"s":"")+" with the same name already exist here. Replace "+(clash.length>1?"them":"it")+"?","Replace",true)) return; }
  let n=0, bytes=0; const t0=Date.now();
  for(const it of items){
    const dest=join(baseDir,it.rel);
    try{ if(it.dir){ await ensureDir(dest,baseDir,made); continue; } await ensureDir(parent(dest),baseDir,made); }
    catch(e){ toast(e.message,true); continue; }
    const job=card(it.rel), t=Date.now();
    try{ await putBlob(dest,it.file,job); job.done(); n++; bytes+=it.file.size;

    }catch(e){ job.fail(e.message); if(e.message!=="cancelled") toast(e.message,true); }

async function walkEntry(entry, prefix){
  if(entry.isFile){ const f=await new Promise((ok,bad)=>entry.file(ok,bad)); return [{file:f, rel:prefix+entry.name}]; }
  const dir=prefix+entry.name, out=[{dir:true, rel:dir}], rd=entry.createReader();
  let batch; // readEntries yields at most ~100 at a time and [] when exhausted
  do{ batch=await new Promise((ok,bad)=>rd.readEntries(ok,bad)); for(const k of batch) out.push(...await walkEntry(k, dir+"/")); }while(batch.length);

async function takeDrop(e, baseDir){

  const entries=[...(e.dataTransfer.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const files=[...e.dataTransfer.files];
  if(!entries.length) return files.length && uploadItems(asItems(files), baseDir);
  const items=[]; for(const en of entries) items.push(...await walkEntry(en,""));
  return uploadItems(items, baseDir);

  }
  if(tab==="about"){
    const kv=(k,v)=>[el("dt",null,k),el("dd",null,v)];
    body.append(el("dl","kv",...kv("Firmware",S.name+" v"+S.fw),...kv("Chip",S.chip),...kv("Memory free",human(S.heap)+" (lowest "+human(S.heap_min)+")"),
      ...kv("Up for",Math.floor(S.uptime/3600)+" h "+Math.floor(S.uptime%3600/60)+" min"),
      ...kv("SD card",S.sd?S.sd_type+" · "+human(S.sd_total)+" · SPI "+S.sd_hz/1e6+" MHz":"–"),
      ...kv("Battery",S.bat>=0?S.bat+"% · "+(S.bat_mv/1000).toFixed(2)+" V":"–"),
      ...kv("Addresses",[S.ip,S.ap_up?S.ap_ip+" (hotspot)":"",S.usb&&S.usb.running?S.usb.ip+" (USB)":""].filter(Boolean).join(" · ")),
      ...kv("App slot",S.slot)));
  }
}
async function joinWifi(ssid,secure){
  const pw=secure?await ask("Join “"+ssid+"”","Password","","Join"):"";
  if(pw===null) return;
  toast("Joining "+ssid+"… (up to 15 s)");
  try{ const r=await jpost("/api/wifi",{ssid,password:pw});
    if(r.connected){ modal("Connected",el("div",null,el("p",null,"The Cardputer joined ",el("b",null,ssid),"."),
      el("p",null,"If this device isn't on ",el("b",null,ssid)," yet, switch to it, then open ",el("code","addr","http://"+r.host+".local")," or ",el("code","addr","http://"+r.ip),".")),
      [el("button",{class:"btn primary",onclick:closeModal},"Got it")],"narrow"); }
    else toast(r.detail,true);
  }catch(e){ toast(e.message,true); }
}
async function usbDrive(on){ await guard(async()=>{ await jpost("/api/usb",{drive:on}); toast(on?"The SD card is now a USB drive on your computer":"The SD card is back"); closeModal(); await refreshStatus(); render(); }); }

/* ---------- console ---------- */
function log(text,cls){ const o=$("#out"); o.append(el("div",cls||null,text)); o.scrollTop=o.scrollHeight; }
$("#bTerm").onclick=()=>{ $("#console").classList.toggle("hidden"); if(!$("#console").classList.contains("hidden")) $("#cmd").focus(); };
const HIST=[]; let hi=-1;
$("#cmd").addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"){ if(hi<HIST.length-1){hi++; e.target.value=HIST[HIST.length-1-hi];} e.preventDefault(); }
  else if(e.key==="ArrowDown"){ if(hi>0){hi--; e.target.value=HIST[HIST.length-1-hi];} else {hi=-1;e.target.value="";} e.preventDefault(); }
  else if(e.key==="Enter"){ const v=e.target.value.trim(); e.target.value=""; hi=-1; if(v){HIST.push(v); runCmd(v);} }
});
const HELP=`commands
  ls [path]            list a folder          cd <path>          change folder
  cat <file>           print (first 8 KB)     head <file> [n]    first n lines
  edit <file>          open in the editor     find <text|*.glob> search from here
  mkdir <name>         new folder             touch <name>       new empty file
  mv <src> <dst>       rename / move          cp <src> <dst>     copy (background)
  rm <path>            to the Trash           rm -f <path>       delete for good
  get <file>           download               zip <folder>       download as ZIP
  put                  upload here            du <path>          folder size
  sha256 <file>        checksum               df                 card usage
  info                 device status          scan               Wi-Fi networks
  wifi <ssid> <pass>   join and save          passwd <new>       change password
  name <host>          set <host>.local       usbdrive on|off    lend card over USB
  launcher             back to M5Launcher     reboot             restart
  clear`;
function abs(p){ if(!p)return CWD; if(p.startsWith("/"))return p.replace(/\/+$/,"")||"/";
  const st=[]; for(const s of (CWD+"/"+p).split("/")){ if(!s||s===".")continue; if(s===".."){st.pop();continue;} st.push(s); }
  return "/"+st.join("/"); }
async function runCmd(line){
  log("$ "+line,"cmd");
  const [c,...a]=line.split(/\s+/);
  try{
    switch(c){
      case "help": log(HELP); break;
      case "clear": $("#out").innerHTML=""; break;
      case "pwd": log(CWD); break;
      case "ls": { const d=await jget("/api/list?path="+enc(abs(a[0])));
        d.entries.sort((x,y)=>(y.dir-x.dir)||x.name.localeCompare(y.name)); if(!d.entries.length) log("(empty)","dim");
        for(const e of d.entries) log((e.dir?"d ":"- ")+String(e.dir?"":human(e.size)).padStart(8," ")+"  "+e.name); break; }
      case "cd": { const p=abs(a[0]||"/"); await jget("/api/list?path="+enc(p)); go(p); break; }
      case "cat": case "head": { const n=c==="head"?parseInt(a[1]||"20"):0;
        const r=await api("/api/download?path="+enc(abs(a[0]))+"&max=8192"); if(!r.ok) throw new Error((await r.json()).error);
        let t=await r.text(); if(n) t=t.split("\n").slice(0,n).join("\n"); log(t); break; }
      case "edit": openText({name:base(abs(a[0])),path:abs(a[0])}); break;
      case "find": { const r=await jget("/api/find?path="+enc(CWD)+"&q="+enc(a.join(" ")));
        for(const x of r.results) log((x.dir?"d ":"- ")+x.path); log(r.results.length+" found"+(r.truncated?" (stopped early)":""),"dim"); break; }
      case "mkdir": await jpost("/api/mkdir?path="+enc(abs(a[0]))); render(); log("ok","dim"); break;
      case "touch": await jpost("/api/touch?path="+enc(abs(a[0]))); render(); log("ok","dim"); break;
      case "rm": { const f=a[0]==="-f", p=abs(f?a[1]:a[0]); await jpost("/api/delete?path="+enc(p)+(f?"":"&trash=1")); render(); log(f?"deleted":"moved to the Trash","dim"); break; }
      case "mv": await jpost("/api/rename?from="+enc(abs(a[0]))+"&to="+enc(abs(a[1]))); render(); log("ok","dim"); break;
      case "cp": await jpost("/api/copy?from="+enc(abs(a[0]))+"&to="+enc(abs(a[1]))); watchJob("Copying"); break;
      case "get": download(dlUrl(abs(a[0])),base(abs(a[0]))); break;
      case "zip": zipOne(abs(a[0])); break;
      case "put": $("#file").click(); break;
      case "du": { const r=await jget("/api/du?path="+enc(abs(a[0]))); log(human(r.bytes)); break; }
      case "sha256": await jpost("/api/hash?path="+enc(abs(a[0]))); watchJob("Checksum"); break;
      case "df": await refreshStatus(); log("sd  "+human(STATUS.sd_used)+" used / "+human(STATUS.sd_total)+" ("+STATUS.sd_type+")"); break;
      case "info": { await refreshStatus(); const S=STATUS;
        log(["firmware "+S.name+" v"+S.fw,"chip     "+S.chip,"network  "+(S.ap?"hotspot "+S.ap_ssid:S.ssid+" ("+S.rssi+" dBm)"),"ip       "+S.ip,
          "usb      "+(S.usb.running?S.usb.ip+(S.usb.host?" (connected)":""):"off"),"heap     "+human(S.heap)+" free","battery  "+(S.bat>=0?S.bat+"%":"–"),
          "launcher "+(S.launcher?"yes":"no"),"uptime   "+S.uptime+" s"].join("\n")); break; }
      case "scan": { const r=await jget("/api/wifi/scan"); for(const n of r.networks) log(String(n.rssi).padStart(4)+" dBm  "+n.ssid+(n.secure?"":"  (open)")+(n.saved?"  *saved":"")); break; }
      case "wifi": { if(!a[0]) throw new Error("usage: wifi <ssid> <password>"); log("connecting…","dim");
        const j=await jpost("/api/wifi",{ssid:a[0],password:a.slice(1).join(" ")}); log(j.connected?"connected — "+j.ip+" / "+j.host+".local":j.detail,j.connected?null:"err"); break; }
      case "passwd": if(!a[0]) throw new Error("usage: passwd <new password, 8+ characters>");
        await jpost("/api/passwd",{password:a.join(" ")}); log("password changed — other sessions signed out","dim"); break;
      case "name": await jpost("/api/name",{name:a[0]||""}); log("now http://"+(a[0]||"").toLowerCase()+".local","dim"); break;
      case "usbdrive": await usbDrive(a[0]==="on"); break;
      case "launcher": launcher(); break;
      case "reboot": if(await confirmBox("Restart?","PocketWUI restarts.","Restart")){ jpost("/api/reboot").catch(()=>{}); restarting(); } break;
      default: log("unknown command: "+c+" (try: help)","err");
    }
  }catch(e){ log(e.message,"err"); }
}

/* ---------- keyboard ---------- */
addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(openMenu) closeMenu(); else if($("#modal.on")) closeModal(); }
  if(e.ctrlKey&&e.key==="`"){ e.preventDefault(); $("#bTerm").onclick(); }
  const typing=e.target.closest&&e.target.closest("input,textarea,select");
  if(!typing&&e.key==="/"){ e.preventDefault(); $("#q").focus(); }
  if(!typing&&gallery.step&&(e.key==="ArrowLeft"||e.key==="ArrowRight")) gallery.step(e.key==="ArrowLeft"?-1:1);
});

/* ---------- boot ---------- */
async function boot(){
  log("PocketWUI — type `help` for commands.","dim");
  await refreshStatus();
  // Keep file dates right: the Cardputer has no clock battery, so the browser lends it the time.
  if(!STATUS.time_ok||Math.abs(STATUS.now-Date.now()/1000)>120)
    jpost("/api/time",{epoch:Math.floor(Date.now()/1000),tz:new Date().getTimezoneOffset()}).catch(()=>{});
  await go("/");
  if(!boot.timer) boot.timer=setInterval(refreshStatus,15000);
}
(async function(){
  // Arriving from the on-screen sign-in QR: /login?k=... redirects here, with
  // ?qr=... only when the code was refused. Drop the query either way.
  const qr=new URLSearchParams(location.search).get("qr");
  if(location.search) history.replaceState(null,"","/");
  try{ const r=await (await fetch("/api/session",{credentials:"same-origin"})).json(); if(r.signed_in){ showApp(); boot(); return; } }catch(e){}
  showLogin();
  if(qr==="expired") $("#loginMsg").textContent="That QR code was already used or has expired. Press the Cardputer's button for a fresh one, or type the password.";
  else if(qr==="locked") $("#loginMsg").textContent="Too many attempts. Wait a minute, then try again.";
})();
