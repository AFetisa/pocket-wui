; PocketWUI — web file manager for the M5Stack Cardputer / Cardputer ADV SD card
; Board: ESP32-S3 (StampS3 core). Build: `pio run`; see docs/DEVELOPING.md
[env:cardputer-adv]
; pioarduino ships Arduino core 3.3.x (EspUsbDevice needs >= 3.3.12).
platform         = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board            = m5stack-stamps3
framework        = arduino
upload_speed     = 1500000
monitor_speed    = 115200
board_build.f_cpu       = 240000000L
board_build.partitions  = partitions.csv
; USB: EspUsbDevice drives the native USB port itself (network adapter + drive),
; which needs the OTG controller: "USB-OTG (TinyUSB)" mode, no USB CDC console.
; Logs therefore go to the internal UART only.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.30
    https://github.com/m5stack/M5Unified.git#0.2.23
    https://github.com/tanakamasayuki/EspUsbDevice.git#v2.5.1
extra_scripts = pre:tools/embed_web.py
